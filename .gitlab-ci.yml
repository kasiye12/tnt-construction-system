# File: .gitlab-ci.yml

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_LATEST: $CI_REGISTRY_IMAGE:latest

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  stage: build
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE $DOCKER_LATEST
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_LATEST
  only:
    - main
    - develop

test:
  stage: test
  script:
    - docker run $DOCKER_IMAGE php artisan test
  only:
    - merge_requests

deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to staging..."
    - ssh $STAGING_SERVER "cd /var/www/tnt && docker-compose pull && docker-compose up -d"
  environment:
    name: staging
    url: https://staging.tntconstruction.com
  only:
    - develop

deploy_production:
  stage: deploy
  script:
    - echo "Deploying to production..."
    - ssh $PRODUCTION_SERVER "cd /var/www/tnt && docker-compose pull && docker-compose up -d"
    - ssh $PRODUCTION_SERVER "docker exec tnt-app php artisan migrate --force"
  environment:
    name: production
    url: https://tntconstruction.com
  when: manual
  only:
    - main